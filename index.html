<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Inkfold</title>
  <meta name="description" content="A private, offline writing studio for novels, stories and scripts.">
  <meta name="theme-color" content="#eff0ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inkfold">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint (no flash)
    try { const t = localStorage.getItem('inkfold-theme'); document.documentElement.dataset.theme = t === 'dark' ? 'dark' : t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <div id="splash">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 4.5h12.5L25 10v17.5H7z" fill="var(--text)"/><path d="M19.5 4.5V10H25z" fill="var(--accent)"/><path d="M16 12.6s-3.9 4.3-3.9 6.8a3.9 3.9 0 0 0 7.8 0c0-2.5-3.9-6.8-3.9-6.8z" fill="var(--bg)"/></svg>
  </div>

  <main id="library" class="view" aria-label="Library"></main>
  <div id="workspace" class="view" hidden></div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" hidden accept=".docx,.md,.markdown,.txt,.inkfold,.zip,application/json,text/plain,text/markdown,application/zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document">

  <script type="module" src="js/app.js"></script>
</body>
</html>
